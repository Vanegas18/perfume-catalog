<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo negro con borde dorado sutil -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <rect width="32" height="32" rx="6" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>

  <!-- Frasco de perfume minimalista -->
  <!-- Cuello del frasco -->
  <rect x="13" y="5" width="6" height="2.5" rx="0.5" fill="#c9a84c"/>
  <!-- Tapa -->
  <rect x="12" y="3.5" width="8" height="2" rx="1" fill="#c9a84c" opacity="0.8"/>
  <!-- Cuerpo del frasco -->
  <rect x="10" y="7.5" width="12" height="14" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.9"/>
  <!-- Reflejo interior del frasco -->
  <rect x="11.5" y="9" width="3" height="9" rx="1" fill="#c9a84c" opacity="0.12"/>
  <!-- Líquido dentro -->
  <rect x="10.5" y="14" width="11" height="7" rx="0" fill="#c9a84c" opacity="0.15"/>
  <rect x="10" y="18" width="12" height="3.5" rx="0 0 2 2" fill="#c9a84c" opacity="0.25"/>

  <!-- Letra M debajo -->
  <text
    x="16"
    y="29"
    font-family="Georgia, serif"
    font-size="7"
    font-weight="400"
    fill="#c9a84c"
    text-anchor="middle"
    letter-spacing="2"
  >MN</text>
</svg>